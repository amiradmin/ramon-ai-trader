# Opt-in override: use only with -f compose.yaml -f compose.pg-shadow.yaml.
# The SQLite database stays authoritative; PostgreSQL shadow is async.
services:
  model:
    image: ramon-ai-trader:pg-canary-working
    volumes:
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./scripts/start_model_pg_shadow.sh:/app/start_model_pg_shadow.sh:ro
    entrypoint: ["/bin/sh", "/app/start_model_pg_shadow.sh"]
    environment:
      RAMON_PG_MARKET_SHADOW_DSN: ""
      RAMON_PG_SHADOW_ASYNC_ENABLED: "0"
      RAMON_M15_WRITE_BACKEND: sqlite
      RAMON_M15_HISTORY_BACKEND: sqlite
