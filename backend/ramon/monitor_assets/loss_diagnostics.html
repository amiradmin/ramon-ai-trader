<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramon · تحلیل زیان معاملات</title><link rel="stylesheet" href="/style.css">
<style>body{padding:24px;max-width:1250px;margin:auto;color:#e8edf5;background:#101520;font-family:system-ui}a{color:#93c5fd}header{display:flex;justify-content:space-between;gap:12px;align-items:center}section{margin:18px 0;background:#172130;border:1px solid #354359;border-radius:12px;padding:16px}h1{font-size:1.6rem}h2{font-size:1.15rem}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{background:#202e40;border-radius:8px;padding:12px}.metric strong{display:block;font-size:1.45rem;margin-top:6px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:right}th,td{padding:9px;border-bottom:1px solid #344255;white-space:nowrap}th{color:#a9bed3}td.neg{color:#ffa4a4}small,p{color:#bbc9d6}.error{color:#ffb4b4}button{padding:8px 14px;border:1px solid #6286a8;background:#223b56;color:white;border-radius:8px;cursor:pointer}</style>
</head><body><header><h1>تحلیل زیان معاملات Ramon</h1><a href="/">بازگشت به داشبورد</a></header>
<p>تحلیل توصیفی معاملات بسته‌شده، بدون تغییر در معامله، ریسک یا آموزش مدل. ساعت‌ها بر اساس تهران هستند؛ در نبود زمان معتبر، از زمان دریافت گزارش استفاده می‌شود.</p>
<button id="refresh">به‌روزرسانی گزارش</button><span id="status" role="status">در حال بارگذاری…</span>
<section><div class="metrics" id="metrics"></div><p id="notes"></p></section>
<div id="groups"></div>
<script>
"use strict";
const groupLabels={hour_tehran:"ساعت معامله (تهران)",direction:"جهت معامله",ea_version:"نسخه EA",exit_reason:"علت خروج",market_regime:"رژیم بازار",entry_source:"منبع ورود"};
const fmt=n=>n===null||n===undefined?"نامشخص":Number(n).toLocaleString("fa-IR",{maximumFractionDigits:4});
function elt(tag,txt,cls){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
async function load(){
 document.getElementById("status").textContent="در حال دریافت…";
 try{
  const r=await fetch("/api/loss-diagnostics",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json();if(!d.available)throw Error(d.reason||"داده موجود نیست");
  const m=document.getElementById("metrics");m.replaceChildren();
  for(const [label,value] of [["معاملات بررسی‌شده",fmt(d.trades_analyzed)],["خالص سود/زیان",fmt(d.net_units)+" واحد حساب"],["سود ناخالص",fmt(d.gross_profit_units)],["زیان ناخالص",fmt(d.gross_loss_units)],["Profit Factor",fmt(d.profit_factor)]]){const div=elt("div","", "metric");div.append(elt("span",label),elt("strong",value));m.append(div)}
  document.getElementById("notes").textContent="فقط "+fmt(d.sample_limit)+" نتیجه اخیر قبل از دسته‌بندی خوانده می‌شود. رکوردهای نامشخص خودکار فرض نمی‌شوند. تطبیق با تاریخچه MT5 هنوز ضروری است.";
  const info=elt("section","");
  info.append(elt("h2","کیفیت داده‌های تاریخی"));
  const missing=d.missing_metadata||{};
  info.append(elt("p","فیلدهای نامشخص — نسخه EA: "+fmt(missing.ea_version)+
    " | رژیم بازار: "+fmt(missing.market_regime)+
    " | منبع ورود: "+fmt(missing.entry_source)));
  const sl=d.stop_loss_audit||{};
  info.append(elt("h2","ممیزی SL / Stop Out"));
  info.append(elt("p","تعداد: "+fmt(sl.count)+" | خالص: "+fmt(sl.net_units)+" واحد حساب؛ تشخیص علت نیازمند تطبیق با MT5 است."));
  const sw=elt("div","","scroll"),st=elt("table",""),sh=elt("tr","");
  for(const h of ["شناسه معامله","نوع خروج","خالص","R","ریسک اولیه","بودجه ریسک","حداقل لات"])sh.append(elt("th",h));
  const sth=elt("thead","");sth.append(sh);st.append(sth);
  const stb=elt("tbody","");
  for(const item of (sl.worst_trades||[])){
    const tr=elt("tr","");
    [item.trade_key,item.exit_reason,fmt(item.net_units),fmt(item.net_r),
     fmt(item.initial_risk_units),fmt(item.risk_budget_units),fmt(item.min_lot_override_used)]
     .forEach(v=>tr.append(elt("td",v)));
    stb.append(tr);
  }
  st.append(stb);sw.append(st);info.append(sw);
  const audit=d.dashboard_opportunity_audit||{};
  const details=elt("section","");
  details.append(elt("h2","ممیزی معاملات دستی از جدول فرصت‌ها (DASHBOARD_OPPORTUNITY)"));
  const ov=audit.overall||{};
  details.append(elt("p","معاملات: "+fmt(ov.trades)+" | خالص: "+fmt(ov.net_units)+
      " | PF: "+fmt(ov.profit_factor)+" | ریسک اولیه ناموجود: "+fmt(audit.missing_initial_risk)));
  for(const [key,title,col] of [["by_exit_reason","نتیجه بر اساس علت خروج","exit_reason"],
                                 ["by_ea_version","نتیجه بر اساس نسخه EA","ea_version"]]){
    details.append(elt("h2",title));
    const wrap=elt("div","","scroll"),tbl=elt("table",""),head=elt("tr","");
    ["گروه","معاملات","سود ناخالص","زیان ناخالص","خالص","PF"].forEach(v=>head.append(elt("th",v)));
    const thead=elt("thead","");thead.append(head);tbl.append(thead);
    const tbody=elt("tbody","");
    for(const r of (audit[key]||[])){
      const tr=elt("tr","");
      [r[col],fmt(r.trades),fmt(r.gross_profit_units),fmt(r.gross_loss_units),
       fmt(r.net_units),fmt(r.profit_factor)].forEach(v=>tr.append(elt("td",v)));
      tbody.append(tr);
    }tbl.append(tbody);wrap.append(tbl);details.append(wrap);
  }
  details.append(elt("h2","۲۵ معامله دستی با بیشترین زیان"));
  const dw=elt("div","","scroll"),dt=elt("table",""),dh=elt("tr","");
  ["Ticket","نسخه EA","جهت","خروج","جزئیات خروج","خالص","R","ریسک اولیه","بودجه ریسک","حداقل لات"]
    .forEach(v=>dh.append(elt("th",v)));
  const dhead=elt("thead","");dhead.append(dh);dt.append(dhead);
  const db=elt("tbody","");
  for(const r of (audit.worst_trades||[])){
    const tr=elt("tr","");
    [r.trade_key,r.ea_version,r.direction,r.exit_reason,r.exit_detail||"—",
     fmt(r.net_units),fmt(r.net_r),fmt(r.initial_risk_units),
     fmt(r.risk_budget_units),fmt(r.min_lot_override_used)]
     .forEach(v=>tr.append(elt("td",v)));db.append(tr);
  }dt.append(db);dw.append(dt);details.append(dw);
  const root=document.getElementById("groups");root.replaceChildren(info,details);
  for(const [key,title] of Object.entries(groupLabels)){
    const sec=elt("section","");sec.append(elt("h2",title));const wrap=elt("div","","scroll");const tab=elt("table","");
    const thead=elt("thead",""),hr=elt("tr","");
    for(const t of ["گروه","معاملات","برد","نرخ برد","سود","زیان","خالص","PF"])hr.append(elt("th",t));
    thead.append(hr);tab.append(thead);
    const tbody=elt("tbody","");
    for(const row of (d.groups[key]||[])){
      const tr=elt("tr","");
      const fields=[row.group,fmt(row.trades),fmt(row.wins),fmt(100*row.win_rate)+"٪",fmt(row.gross_profit_units),fmt(row.gross_loss_units),fmt(row.net_units),fmt(row.profit_factor)];
      fields.forEach((v,i)=>tr.append(elt("td",v,i===6&&row.net_units<0?"neg":"")));
      tbody.append(tr);
    }
    tab.append(tbody);wrap.append(tab);sec.append(wrap);root.append(sec);
  }
  document.getElementById("status").textContent="گزارش دریافت شد";
 }catch(e){document.getElementById("status").textContent="گزارش در دسترس نیست: "+e.message;document.getElementById("status").className="error"}
}
document.getElementById("refresh").addEventListener("click",load);load();
</script></body></html>
