<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramon | Real Performance</title><style>
:root{color-scheme:light dark;--bg:#edf2f7;--panel:#fff;--text:#17283d;--muted:#526477;--line:#cad5e0;--accent:#176f91}@media(prefers-color-scheme:dark){:root{--bg:#101926;--panel:#192638;--text:#edf4fa;--muted:#aabbd0;--line:#35465c;--accent:#70c8e7}}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}a{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.muted{color:var(--muted)}.value{font-size:26px;font-weight:650}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line)}h1,h2{margin-top:0}.positive{color:#16865e}.negative{color:#cf5252}select{padding:8px}svg{width:100%;height:180px} @media(max-width:550px){main{padding:12px}}</style></head><body><main><header><div><h1>Real Account Performance</h1><p class="muted">V14.1 · Recorded outcomes only · Read-only</p></div><nav><a href="{% url 'ramon-dashboard' %}">Dashboard</a> · <a href="{% url 'ramon-regime-dashboard' %}">Market Regime</a> · <a id="download" href="{% url 'ramon-real-performance-report' %}?download=1">Download JSON</a></nav></header><label>Lookback <select id="days"><option>7</option><option selected>30</option><option>90</option><option>365</option></select> days</label><p id="status" role="status">Loading…</p><div id="cards" class="grid"></div><section class="card"><h2>Verified cumulative closed P&amp;L</h2><div id="chart"></div></section><section class="card"><h2>Strategy performance</h2><div id="strategies" class="table-wrap"></div></section><section class="card"><h2>Recent recorded outcomes</h2><div id="outcomes" class="table-wrap"></div></section><section class="card"><h2>Coverage and limitations</h2><div id="limits"></div></section></main><script>
const $=id=>document.getElementById(id),url="{% url 'ramon-real-performance-report' %}";
function el(tag,txt,parent,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt??'—';if(cls)e.className=cls;if(parent)parent.append(e);return e}
const fmt=x=>x==null?'—':Number(x).toFixed(2);
function table(parent,headers,rows){parent.replaceChildren();if(!rows.length){el('p','No recorded outcomes.',parent);return}const t=el('table',undefined,parent),h=el('tr',undefined,el('thead',undefined,t)),b=el('tbody',undefined,t);headers.forEach(x=>el('th',x,h));rows.forEach(row=>{const tr=el('tr',undefined,b);row.forEach(x=>el('td',x??'—',tr))})}
function graph(rows){const parent=$('chart');parent.replaceChildren();const grouped=new Map();for(const r of rows.filter(x=>x.strategy!=='UNATTRIBUTED'))grouped.set(r.closed_at,(grouped.get(r.closed_at)||0)+Number(r.net_pnl));if(!grouped.size){el('p','No verified outcomes.',parent);return}let values=[0];for(const p of grouped.values())values.push(values.at(-1)+p);const min=Math.min(...values,0),max=Math.max(...values,0),span=max-min||1,ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 800 180');svg.setAttribute('role','img');svg.setAttribute('aria-label','Cumulative verified closed P&L');const line=document.createElementNS(ns,'polyline');line.setAttribute('points',values.map((v,i)=>(20+i*760/(values.length-1))+','+(160-(v-min)*140/span)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#16865e');line.setAttribute('stroke-width','2');svg.append(line);parent.append(svg);el('p','Outcome timestamps in sequence · range '+fmt(min)+' to '+fmt(max),parent,'muted')}
let generation=0;
async function refresh(){const g=++generation,days=$('days').value;$('download').href=url+'?days='+days+'&download=1';try{const r=await fetch(url+'?days='+days,{cache:'no-store'});if(!r.ok||r.redirected)throw Error('Report unavailable');const d=await r.json();if(g!==generation)return;if(d.status!=='READY')throw Error(d.status);$('status').textContent=d.symbol+' · '+d.currency+' (broker units) · '+d.generated_at;$('cards').replaceChildren();for(const [label,value] of [['Verified P&L',fmt(d.verified.net_pnl)],['Verified outcomes',d.verified.outcomes],['Win rate',d.verified.win_rate==null?'—':fmt(d.verified.win_rate)+'%'],['Profit factor',fmt(d.verified.profit_factor)],['Closed P&L drawdown',fmt(d.verified.closed_pnl_drawdown)],['Unattributed outcomes',d.unattributed.outcomes],['Unattributed P&L',fmt(d.unattributed.net_pnl)]]){const c=el('section',undefined,$('cards'),'card');el('div',label,c,'muted');el('div',value,c,'value')}graph(d.outcomes);table($('strategies'),['Strategy','Outcomes','Wins','Losses','Win %','Net P&L','PF','Expectancy','Closed DD','Commission coverage','Swap coverage','Fee coverage'],d.strategies.map(x=>[x.strategy,x.outcomes,x.wins,x.losses,fmt(x.win_rate),fmt(x.net_pnl),fmt(x.profit_factor),fmt(x.expectancy),fmt(x.closed_pnl_drawdown),fmt(x.costs.commission.reported_sum)+' ('+x.costs.commission.coverage+')',fmt(x.costs.swap.reported_sum)+' ('+x.costs.swap.coverage+')',fmt(x.costs.fee.reported_sum)+' ('+x.costs.fee.coverage+')']));table($('outcomes'),['Closed UTC','Strategy','P&L','Attribution','Trade ID'],d.outcomes.slice(-100).reverse().map(x=>[x.closed_at,x.strategy,fmt(x.net_pnl),x.attribution,x.trade_id]));$('limits').replaceChildren();d.limitations.forEach(x=>el('p',x,$('limits')))}catch(e){if(g!==generation)return;$('status').textContent='Unavailable · '+e.message;for(const id of ['cards','chart','strategies','outcomes','limits'])$(id).replaceChildren()}}
$('days').addEventListener('change',refresh);async function poll(){await refresh();setTimeout(poll,30000)}poll();
</script></body></html>
