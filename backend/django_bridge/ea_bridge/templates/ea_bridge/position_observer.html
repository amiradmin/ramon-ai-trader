<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramon | Position Management</title>
<style>
:root{color-scheme:light dark;--bg:#edf2f7;--panel:#fff;--text:#17283d;--muted:#526477;--line:#cad5e0;--accent:#176f91}@media(prefers-color-scheme:dark){:root{--bg:#101926;--panel:#192638;--text:#edf4fa;--muted:#aabbd0;--line:#35465c;--accent:#70c8e7}}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:var(--accent)}.card{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.muted{color:var(--muted)}.value{font-size:24px;font-weight:650}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line)}select{padding:8px}h2{margin-top:0}@media(max-width:550px){main{padding:12px}}
</style></head><body><main><header><div><h1>Position Management Observer</h1><p class="muted">V15.1 · Observation only · No order creation or changes</p></div><nav><a href="{% url 'ramon-dashboard' %}">Dashboard</a> · <a href="{% url 'ramon-execution-quality' %}">Execution quality</a> · <a href="{% url 'ramon-position-management-report' %}?download=1">Download JSON</a></nav></header>
<p id="status" role="status">Loading…</p><div id="strategies" class="grid"></div><section class="card"><h2>Current positions</h2><label>Display strategy <select id="filter"><option value="">All strategies</option></select></label><p class="muted">Display filter only; does not enable or disable trading.</p><div class="table-wrap" id="positions"></div></section><section class="card"><h2>Hypothetical management actions</h2><div class="table-wrap" id="rules"></div></section><section class="card"><h2>Limitations</h2><div id="limits"></div></section></main>
<script>
const $=x=>document.getElementById(x),fmt=x=>x==null?'—':Number(x).toFixed(3);
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text??'—';if(cls)e.className=cls;if(parent)parent.append(e);return e}
function table(id,head,rows){const root=$(id);root.replaceChildren();if(!rows.length){el('p','No matching observations.',root);return}const t=el('table',undefined,root),h=el('tr',undefined,el('thead',undefined,t)),b=el('tbody',undefined,t);head.forEach(x=>el('th',x,h));rows.forEach(row=>{const tr=el('tr',undefined,b);row.forEach(x=>el('td',x??'—',tr))})}
let report=null;
function render(){const d=report;if(!d)return;const selected=$('filter').value,rows=(d.positions||[]).filter(x=>!selected||x.strategy===selected);table('positions',['Ticket','Strategy','Status','Side','Entry','SL','TP','Current R','Remaining R:R','ATR','Holding (s)'],rows.map(x=>[x.ticket,x.strategy,x.status,x.side,fmt(x.entry),fmt(x.current_stop),fmt(x.target),fmt(x.current_r),fmt(x.remaining_reward_risk),fmt(x.candle_context?.atr),fmt(x.holding_seconds)]));table('rules',['Ticket','Strategy','Rule','Hypothetical SL','Status'],rows.flatMap(x=>(x.hypotheses||[]).map(h=>[x.ticket,x.strategy,h.rule,fmt(h.proposed_stop),h.status])))}
$('filter').addEventListener('change',render);
async function refresh(){try{const r=await fetch("{% url 'ramon-position-management-report' %}",{cache:'no-store'});if(!r.ok||r.redirected)throw Error('Report unavailable');report=await r.json();$('status').textContent=report.status+' · '+report.generated_at;$('strategies').replaceChildren();const current=$('filter').value;$('filter').replaceChildren();const all=el('option','All strategies',$('filter'));all.value='';for(const s of report.strategies||[]){const card=el('section',undefined,$('strategies'),'card');el('div',s.strategy,card,'muted');el('div',s.observed,card,'value');const opt=el('option',s.strategy,$('filter'));opt.value=s.strategy}$('filter').value=[...$('filter').options].some(o=>o.value===current)?current:'';$('limits').replaceChildren();(report.limitations||[]).forEach(x=>el('p',x,$('limits')));render()}catch(e){report=null;$('status').textContent='Unavailable · '+e.message;for(const id of ['positions','rules','strategies','limits'])$(id).replaceChildren()}}
async function loop(){await refresh();setTimeout(loop,5000)}loop();
</script></body></html>
