<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramon | Execution Quality</title><style>
:root{color-scheme:light dark;--bg:#edf2f7;--panel:#fff;--text:#17283d;--muted:#526477;--line:#cad5e0;--accent:#176f91}@media(prefers-color-scheme:dark){:root{--bg:#101926;--panel:#192638;--text:#edf4fa;--muted:#aabbd0;--line:#35465c;--accent:#70c8e7}}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}a{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.muted{color:var(--muted)}.value{font-size:26px;font-weight:650}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line)}h1,h2{margin-top:0}select{padding:8px}@media(max-width:550px){main{padding:12px}}</style></head><body><main><header><div><h1>Execution Quality Monitor</h1><p class="muted">V14.2 · Observation only · No order blocking</p></div><nav><a href="{% url 'ramon-dashboard' %}">Dashboard</a> · <a href="{% url 'ramon-real-performance' %}">Real Performance</a> · <a id="download" href="{% url 'ramon-execution-quality-report' %}?download=1">Download JSON</a></nav></header><label>Lookback <select id="days"><option>7</option><option selected>30</option><option>90</option><option>365</option></select> days</label><p id="status" role="status">Loading…</p><div id="cards" class="grid"></div><section class="card"><h2>Server-clock latency (seconds)</h2><div id="latency" class="table-wrap"></div></section><section class="card"><h2>Price measurements (points unless ratio)</h2><div id="prices" class="table-wrap"></div></section><section class="card"><h2>Strategy comparison</h2><div id="strategies" class="table-wrap"></div></section><section class="card"><h2>Recent commands</h2><div id="commands" class="table-wrap"></div></section><section class="card"><h2>Limitations</h2><div id="limits"></div></section></main><script>
const $=id=>document.getElementById(id),url="{% url 'ramon-execution-quality-report' %}";
const fmt=x=>x==null?'—':Number(x).toFixed(2);
function el(tag,txt,parent,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt??'—';if(cls)e.className=cls;if(parent)parent.append(e);return e}
function table(id,headers,rows){const parent=$(id);parent.replaceChildren();if(!rows.length){el('p','No recorded commands.',parent);return}const t=el('table',undefined,parent),h=el('tr',undefined,el('thead',undefined,t)),b=el('tbody',undefined,t);headers.forEach(x=>el('th',x,h));rows.forEach(row=>{const tr=el('tr',undefined,b);row.forEach(x=>el('td',x??'—',tr))})}
function stats(id,data){table(id,['Metric','Available','Missing','Mean','Median','P95','Min','Max'],Object.entries(data).map(([k,v])=>[k.replaceAll('_',' '),v.available,v.missing,fmt(v.mean),fmt(v.median),fmt(v.p95),fmt(v.minimum),fmt(v.maximum)]))}
let generation=0;
async function refresh(){const g=++generation,days=$('days').value;$('download').href=url+'?days='+days+'&download=1';try{const r=await fetch(url+'?days='+days,{cache:'no-store'});if(!r.ok||r.redirected)throw Error('Report unavailable');const d=await r.json();if(g!==generation)return;if(d.status!=='READY')throw Error(d.status);const t=d.totals;$('status').textContent=d.symbol+' · '+d.generated_at+' · Excluded unverified commands: '+d.excluded_unverified_commands;$('cards').replaceChildren();for(const [label,value] of [['Authorized commands',t.commands],['Executed commands',t.states.EXECUTED||0],['Mean claim latency (s)',fmt(t.latency.command_to_claim_seconds.mean)],['Mean claim-to-terminal (s)',fmt(t.latency.claim_to_terminal_seconds.mean)],['Mean reference-to-fill (pts)',fmt(t.prices.decision_to_fill_points.mean)],['Mean broker slippage (pts)',fmt(t.prices.request_slippage_points.mean)],...Object.entries(t.warning_counts).map(([k,v])=>['Warnings > '+k+' × spread',v])]){const c=el('section',undefined,$('cards'),'card');el('div',label,c,'muted');el('div',value,c,'value')}stats('latency',t.latency);stats('prices',t.prices);table('strategies',['Strategy','Commands','Executed','Claim mean (s)','Terminal mean (s)','Pre-request pts','Fill deviation pts','Broker slippage pts','Warnings > 2×'],d.strategies.map(x=>[x.strategy,x.commands,x.states.EXECUTED||0,fmt(x.latency.command_to_claim_seconds.mean),fmt(x.latency.claim_to_terminal_seconds.mean),fmt(x.prices.decision_to_request_points.mean),fmt(x.prices.decision_to_fill_points.mean),fmt(x.prices.request_slippage_points.mean),x.warning_counts['2']]));table('commands',['Created UTC','Strategy','State','Side','Timing anchor','Decision to command (s)','Claim (s)','Claim to terminal (s)','Pre-request pts','Fill pts','Broker pts','Warning multiples','Command ID'],d.commands.slice(-100).reverse().map(x=>[x.created_at,x.strategy,x.state,x.side,x.decision_timestamp_basis,fmt(x.decision_to_command_seconds),fmt(x.command_to_claim_seconds),fmt(x.claim_to_terminal_seconds),fmt(x.decision_to_request_points),fmt(x.decision_to_fill_points),fmt(x.request_slippage_points),x.hypothetical_warning_thresholds.join(', '),x.command_id]));$('limits').replaceChildren();d.limitations.forEach(x=>el('p',x,$('limits')))}catch(e){if(g!==generation)return;$('status').textContent='Unavailable · '+e.message;for(const id of ['cards','latency','prices','strategies','commands','limits'])$(id).replaceChildren()}}
$('days').addEventListener('change',refresh);async function poll(){await refresh();setTimeout(poll,30000)}poll();
</script></body></html>
