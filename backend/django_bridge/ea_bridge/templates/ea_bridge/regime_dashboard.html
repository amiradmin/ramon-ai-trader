<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramon | Market Regime</title><style>
:root{color-scheme:light dark;--bg:#edf2f7;--panel:#fff;--text:#17283d;--muted:#526477;--line:#cad5e0;--accent:#176f91}@media(prefers-color-scheme:dark){:root{--bg:#101926;--panel:#192638;--text:#edf4fa;--muted:#aabbd0;--line:#35465c;--accent:#70c8e7}}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}a{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}.card{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow-wrap:anywhere}.muted{color:var(--muted)}.value{font-size:26px;font-weight:650}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line)}h1,h2,h3{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:550px){main{padding:12px}}</style></head><body><main><header><div><h1>Market Regime Coordinator</h1><p class="muted">V12.2 · Advisory only · No order authorization</p></div><nav><a href="{% url 'ramon-dashboard' %}">Dashboard</a> · <a href="{% url 'ramon-research-shadow' %}">Shadow Trading</a> · <a href="{% url 'ramon-regime-report' %}?download=1">Download report</a></nav></header><p id="status" role="status">Loading…</p><div class="card"><div class="muted">Recorded regime consensus</div><div id="regime" class="value">—</div><p id="alignment"></p><p id="votes" class="muted"></p></div><h2>Timeframe context</h2><div id="timeframes" class="grid"></div><section class="card"><h2>Strategy suitability</h2><div id="strategies" class="table-wrap"></div></section><section class="card"><h2>Qualified candidate ranking</h2><div id="ranking" class="table-wrap"></div></section><section class="card"><h2>Limitations</h2><div id="limits"></div></section></main><script>
const $=id=>document.getElementById(id);
function el(tag,txt,parent,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt??'—';if(cls)e.className=cls;if(parent)parent.append(e);return e}
function table(parent,headers,rows){parent.replaceChildren();if(!rows.length){el('p','No candidates available.',parent);return}const t=el('table',undefined,parent),h=el('tr',undefined,el('thead',undefined,t)),b=el('tbody',undefined,t);headers.forEach(x=>el('th',x,h));rows.forEach(row=>{const tr=el('tr',undefined,b);row.forEach(x=>el('td',x??'—',tr))})}
async function refresh(){try{const r=await fetch("{% url 'ramon-regime-report' %}",{cache:'no-store'});if(!r.ok||r.redirected)throw Error('Report unavailable');const d=await r.json();$('status').textContent=d.symbol+' · '+d.generated_at+' · '+d.mode;$('regime').textContent=d.regime;$('alignment').textContent=d.alignment;$('votes').textContent=JSON.stringify(d.regime_votes);$('timeframes').replaceChildren();for(const [tf,v] of Object.entries(d.timeframes)){const c=el('section',undefined,$('timeframes'),'card');el('h3',tf,c);el('div',v.direction||'Unavailable',c,'value');el('p',v.status,c);el('p','EMA20: '+(v.ema20?.toFixed(2)??'—')+' · EMA50: '+(v.ema50?.toFixed(2)??'—'),c,'muted');el('p','Missing slots: '+(v.missing_slots??'—'),c,'muted');for(const g of v.gaps||[])el('p',g.previous+' → '+g.next+' · '+g.missing_slots+' · '+g.classification,c);for(const s of v.off_grid||[])el('p','Off-grid: '+s,c)}
table($('strategies'),['Strategy','State','Regime fit','Action','Reason','Risk approved'],d.strategies.map(x=>[x.setup,x.status,x.regime_fit,x.action,x.reason,x.risk_approved]));table($('ranking'),['Strategy','Side','Score','Quality','Fit'],d.ranked_candidates.map(x=>[x.setup,x.action,x.score,x.quality,x.regime_fit]));$('limits').replaceChildren();d.limitations.forEach(x=>el('p',x,$('limits')))}catch(e){$('status').textContent='Unavailable · '+e.message+' · Previous report may be stale.'}}
async function poll(){await refresh();setTimeout(poll,30000)}poll();
</script></body></html>
