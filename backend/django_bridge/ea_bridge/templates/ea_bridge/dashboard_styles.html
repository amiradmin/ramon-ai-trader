<style>
:root{--bg:#0a0e14;--panel:#111823;--panel2:#151f2c;--line:#263244;--text:#edf3fb;--muted:#8c9bb0;--green:#42d6a0;--red:#ff7185;--amber:#f4c56a;--blue:#7eaaff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#182941 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5b8cff,#52e0b2);display:grid;place-items:center;color:#07111b;font-weight:900;font-size:19px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:800}.title{font-size:26px;line-height:1.2;font-weight:800;margin:3px 0}.sub{color:var(--muted);font-size:12px}.status{border:1px solid #315243;background:#10271f;color:var(--green);padding:8px 12px;border-radius:99px;font-size:12px;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
.notice{border:1px solid #55492e;background:#211d14;color:#e8d6a7;padding:12px 15px;border-radius:12px;margin-bottom:18px;font-size:12px}
.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:linear-gradient(145deg,rgba(21,31,44,.96),rgba(15,22,32,.96));border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;letter-spacing:-.8px;margin:8px 0 3px}.stat-foot{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:25px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input,.btn{background:#0d141e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:12px}.btn{cursor:pointer}.btn:hover{border-color:var(--blue)}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #202b39;vertical-align:middle}.table tr:last-child td{border-bottom:0}.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px 4px;color:var(--muted);font-size:11px}.pagination-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.pagination select{background:#0d141e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:11px}.pagination .btn:disabled{opacity:.4;cursor:not-allowed}.symbol{font-weight:800}.small{font-size:11px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;letter-spacing:.4px}.pill.buy{background:#123328;color:var(--green)}.pill.sell{background:#3a2028;color:var(--red)}.pill.watch{background:#382f1c;color:var(--amber)}.pill.ready{background:#18304b;color:#9bc5ff}.details{display:none;background:#0c131d}.details.open{display:table-row}.details td{padding:0 14px 16px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:15px 0}.detail-box{background:#121d2a;border:1px solid #243247;border-radius:10px;padding:11px}.detail-box label{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.detail-box strong{font-size:13px}.expand{border:1px solid var(--line);background:#121d2a;color:var(--blue);border-radius:8px;padding:5px 9px;cursor:pointer}.lower{grid-template-columns:1.2fr .8fr}.risk-list{display:grid;gap:14px}.risk-row{display:flex;justify-content:space-between;gap:15px;align-items:center}.risk-row span{color:var(--muted);font-size:12px}.risk-row strong{font-size:13px}
.strategy-card{background:linear-gradient(145deg,#173653,#102238);border-color:#467bad;transition:border-color .15s,box-shadow .15s}
.strategy-card h3{color:#a6d4ff}
.strategy-card.strategy-on{border-color:#62adf0;box-shadow:inset 0 0 0 1px rgba(98,173,240,.12)}
.strategy-card.strategy-position-open{background:#123c2b;border-color:#55edaa;animation:position-green-blink .8s ease-in-out infinite}
.strategy-card.strategy-position-open h3{color:#b0ffda}
@keyframes position-green-blink{0%,100%{background-color:#123c2b;border-color:#36bd80;box-shadow:inset 0 0 0 1px rgba(54,189,128,.2)}50%{background-color:#226d47;border-color:#95ffd0;box-shadow:inset 0 0 0 1px rgba(149,255,208,.4),0 0 14px rgba(66,214,160,.3)}}
@media(prefers-reduced-motion:reduce){.strategy-card.strategy-position-open{animation:none;background:#185339;border-color:#7aefbf}}

.footer{color:#69788c;font-size:11px;text-align:center;padding:24px 0 6px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:17px}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:22px}.card{padding:14px}.title{font-size:22px}}
</style>
