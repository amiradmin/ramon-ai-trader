services:
  pg-training-sync:
    profiles: ["pg-training"]
    image: ramon-ai-trader:pg-canary-working
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-u", "/app/scripts/pg_training_sync_daemon.py"]
    environment:
      PYTHONPATH: /app/src
      RAMON_HISTORY_DB: /data/ramon_history.sqlite3
      RAMON_PG_HOST: postgres-logs
      RAMON_PG_PASSWORD_FILE: /run/secrets/postgres-password
      RAMON_TRAINING_SYNC_INTERVAL_SECONDS: "900"
    volumes:
      - ./data:/data:ro
      - ./src:/app/src:ro
      - ./scripts/pg_training_sync_daemon.py:/app/scripts/pg_training_sync_daemon.py:ro
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro
