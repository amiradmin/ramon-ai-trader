name: Django EA bridge

on:
  pull_request:
    paths:
      - 'django_bridge/**'
      - 'compose.django.yaml'
      - '.github/workflows/django-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'django_bridge/**'
      - 'compose.django.yaml'
      - '.github/workflows/django-bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_bridge
    env:
      DJANGO_SECRET_KEY: ci-test-only-secret
      RAMON_EA_BEARER_TOKEN: ci-test-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: django_bridge/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test ea_bridge
