name: Ramon MT5 command EA source guard

on:
  pull_request:
    paths:
      - "mt5/RamonCommandEA*.mq5"
      - ".github/workflows/ramon-mt5-source-guard.yml"
      - "scripts/update_build_ramon.sh"
  push:
    branches: ["main"]
    paths:
      - "mt5/RamonCommandEA*.mq5"
      - ".github/workflows/ramon-mt5-source-guard.yml"
      - "scripts/update_build_ramon.sh"

permissions:
  contents: read

jobs:
  command-ea-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-command update script and compiler invocation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/update_build_ramon.sh
          grep -Fq 'mt5/RamonCommandEA_v1.02.mq5' scripts/update_build_ramon.sh || {
            echo "FAIL: deployment script must compile the pinned command EA source." >&2
            exit 1
          }
          grep -Fq 'mt5/Ramon_v0.62.6.mq5' scripts/update_build_ramon.sh || {
            echo "FAIL: deployment script must compile the pinned strategy EA source." >&2
            exit 1
          }
          if grep -Fq 'RamonResearchTelemetry.mqh' scripts/update_build_ramon.sh || grep -Eq '(^|[^A-Za-z0-9_])RT_[A-Za-z0-9_]+' mt5/Ramon_v0.62.6.mq5; then
            echo "FAIL: optional research telemetry dependency must be absent from the strategy build." >&2
            exit 1
          fi
          if grep -Eq 'docker compose[^\n]*down[[:space:]]+-v|docker volume rm|docker system prune' scripts/update_build_ramon.sh; then
            echo "FAIL: deployment script must not delete Docker volumes or prune resources." >&2
            exit 1
          fi
          if ! grep -Fq 'wine "$METAEDITOR" "/compile:$WINDOWS_EA_TARGET" /log' scripts/update_build_ramon.sh && ! grep -Fq 'wine "$METAEDITOR" "/compile:$winpath" /log' scripts/update_build_ramon.sh; then
            echo "FAIL: Wine MetaEditor must receive the unquoted no-space /compile:<Windows path> argument." >&2
            exit 1
          fi
          if grep -Fq 'compile_arg="/compile:\\"$WINDOWS_EA_TARGET\\""' scripts/update_build_ramon.sh; then
            echo "FAIL: do not embed literal quote characters in the Wine /compile argument." >&2
            exit 1
          fi
          grep -Fq "tr -d" scripts/update_build_ramon.sh || {
            echo "FAIL: compiler log validation must normalize NUL-padded logs." >&2
            exit 1
          }
          grep -Fq "Result:[[:space:]]*0 errors,[[:space:]]*0 warnings" scripts/update_build_ramon.sh || {
            echo "FAIL: compiler summary must be anchored and require exact zero errors and warnings." >&2
            exit 1
          }
          accepts_zero_summary() {
            tr -d '\000' | grep -Eiq '^[[:space:]]*Result:[[:space:]]*0 errors,[[:space:]]*0 warnings([,[:space:]]|$)'
          }
          printf 'R\000e\000s\000u\000l\000t\000: 0 errors, 0 warnings, 1 ms' | accepts_zero_summary || {
            echo "FAIL: zero-error summary with NUL padding was not accepted." >&2
            exit 1
          }
          if printf '%s\n' 'Result: 10 errors, 0 warnings, 1 ms' | accepts_zero_summary; then
            echo "FAIL: validator accepted a nonzero error count." >&2
            exit 1
          fi
          if printf '%s\n' 'Result: 0 errors, 1 warnings, 1 ms' | accepts_zero_summary; then
            echo "FAIL: validator accepted a nonzero warning count." >&2
            exit 1
          fi
      - name: Check safety-critical source contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(mt5/RamonCommandEA*.mq5)
          if (( ${#sources[@]} == 0 )); then
            echo "No RamonCommandEA source files found" >&2
            exit 1
          fi

          for source in "${sources[@]}"; do
            echo "Checking ${source}"
            grep -Eq 'input bool EnableCommandExecution[[:space:]]*=[[:space:]]*false;' "$source" || {
              echo "FAIL: command execution must default to false: ${source}" >&2
              exit 1
            }
            grep -Eq 'input string DjangoBearerToken[[:space:]]*=[[:space:]]*"";' "$source" || {
              echo "FAIL: bearer token must not be hard-coded: ${source}" >&2
              exit 1
            }
            grep -q 'server_name' "$source" || {
              echo "FAIL: broker server identity field is missing: ${source}" >&2
              exit 1
            }
            grep -q 'broker_day' "$source" || {
              echo "FAIL: broker-local day field is missing: ${source}" >&2
              exit 1
            }
            grep -q 'JsonBool(response,"trading_authorization",false)' "$source" || {
              echo "FAIL: missing fail-closed server trading-authorization check: ${source}" >&2
              exit 1
            }
            grep -q 'JsonBool(command,"execution_authorized",false)' "$source" || {
              echo "FAIL: missing fail-closed command execution-authorization check: ${source}" >&2
              exit 1
            }
          done

          echo "Static safety contract passed. This does not replace MetaEditor compilation or demo validation."

  compile-mql5:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MetaTrader 5 and MetaEditor
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          $installProcess = Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -PassThru
          $installExitCode = $installProcess.ExitCode
          $metaEditor = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $metaEditor) {
            throw "MetaEditor executable was not found after installation (installer exit code $installExitCode)"
          }
          Write-Output "MetaEditor located at $metaEditor (installer exit code $installExitCode)"

          $terminalRoot = Split-Path $metaEditor
          $terminalExe = Join-Path $terminalRoot "terminal64.exe"
          if (Test-Path $terminalExe) {
            $terminalProcess = Start-Process -FilePath $terminalExe -ArgumentList "/portable" -PassThru
            Start-Sleep -Seconds 25
            if (-not $terminalProcess.HasExited) {
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $mql5Roots = @((Join-Path $terminalRoot "MQL5"))
          $terminalDataRoot = Join-Path $env:APPDATA "MetaQuotes\Terminal"
          if (Test-Path $terminalDataRoot) {
            $mql5Roots += Get-ChildItem $terminalDataRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "MQL5" }
          }
          $mql5Root = $mql5Roots |
            Where-Object { Test-Path (Join-Path $_ "Include\Trade\Trade.mqh") } |
            Select-Object -First 1
          if (-not $mql5Root) {
            throw "MetaTrader standard MQL5 include library was not initialized by the terminal"
          }
          Write-Output "Using MQL5 include root $mql5Root"
          $expertDir = Join-Path $mql5Root "Experts\RamonCI"
          New-Item -ItemType Directory -Force -Path $expertDir | Out-Null

          $sources = Get-ChildItem "mt5" -Filter "RamonCommandEA*.mq5" -File
          if (-not $sources) {
            throw "No RamonCommandEA source files found"
          }

          foreach ($source in $sources) {
            $target = Join-Path $expertDir $source.Name
            Copy-Item $source.FullName $target -Force
            $logPath = [System.IO.Path]::ChangeExtension($target, ".log")
            $ex5Path = [System.IO.Path]::ChangeExtension($target, ".ex5")
            if (Test-Path $logPath) { Remove-Item $logPath -Force }
            if (Test-Path $ex5Path) { Remove-Item $ex5Path -Force }

            $arguments = '/compile:"' + $target + '" /include:"' + $mql5Root + '" /log'
            $compileProcess = Start-Process -FilePath $metaEditor -ArgumentList $arguments -Wait -PassThru
            if (-not (Test-Path $logPath)) {
              throw "MetaEditor did not create a compilation log for $($source.Name); process exit code $($compileProcess.ExitCode)"
            }

            $compileLog = Get-Content -Path $logPath -Raw
            Write-Output "===== $($source.Name) compiler log ====="
            Write-Output $compileLog
            if ($compileLog -notmatch "Result:\s*0 errors,\s*0 warnings") {
              throw "Compilation did not report zero errors and zero warnings for $($source.Name)"
            }
            if (-not (Test-Path $ex5Path)) {
              throw "Compilation log reported success but the EX5 file is missing for $($source.Name)"
            }
          }
