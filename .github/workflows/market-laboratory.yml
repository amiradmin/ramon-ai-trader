name: Market laboratory safety and unit tests
on:
  pull_request:
    paths:
      - "lab/**"
      - "docker-compose.lab.yaml"
      - ".github/workflows/market-laboratory.yml"
  push:
    paths:
      - "lab/**"
      - "docker-compose.lab.yaml"
      - ".github/workflows/market-laboratory.yml"
jobs:
  lab-static-and-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile laboratory code
        run: python -m compileall -q lab
      - name: Run isolated impulse candidate unit tests
        run: python -m unittest discover -s lab -p 'test_*.py' -v
      - name: Validate combined Docker Compose laboratory configuration
        env:
          POSTGRES_PASSWORD: github-actions-test-only
          LAB_DB_PASSWORD: github-actions-test-only
        run: |
          touch .env
          docker compose -f docker-compose.yaml -f docker-compose.lab.yaml --profile lab config --quiet
      - name: Confirm trading switches disabled and no network ports published
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path("docker-compose.lab.yaml").read_text()
          assert 'RAMON_EA_COMMAND_CREATION_ENABLED: "0"' in f
          assert 'RAMON_EA_COMMAND_EXECUTION_ENABLED: "0"' in f
          assert 'RAMON_STRATEGY_CONTAINERS_ENABLED: "0"' in f
          assert 'read_only: true' in f
          assert 'ports:' not in f
          dockerfile=Path("lab/Dockerfile").read_text()
          assert "ENV PYTHONPATH=/app:/app/lab" in dockerfile
          assert 'ENTRYPOINT ["python", "lab/run.py"]' in dockerfile
          sql=Path('lab/create_reader.sql').read_text()
          assert "GRANT SELECT ON TABLE public.ea_bridge_marketbar" in sql
          PY
