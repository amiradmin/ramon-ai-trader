name: Ramon Django pipeline checks

on:
  pull_request:
    paths:
      - "backend/django_bridge/**"
      - "docker-compose.yaml"
      - "docs/ramon-django-pipeline/**"
      - ".github/workflows/ramon-django-pipeline.yml"
  push:
    branches: ["main", "feat/ramon-django-pipeline"]
    paths:
      - "backend/django_bridge/**"
      - "docker-compose.yaml"
      - ".github/workflows/ramon-django-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django_bridge
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DB_PATH: /tmp/ramon-django-ci.sqlite3
      RAMON_EA_BEARER_TOKEN: ci-test-token
      RAMON_PIPELINE_INGEST_ENABLED: "0"
      RAMON_REDIS_URL: redis://127.0.0.1:6379/0
      RAMON_PG_PASSWORD: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only-not-a-secret
      RAMON_LOG_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only Compose environment file
        working-directory: .
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ramon
          POSTGRES_USER=ramon
          POSTGRES_PASSWORD=ci-only-not-a-secret
          RAMON_EA_BEARER_TOKEN=ci-test-token
          DJANGO_SECRET_KEY=ci-only-not-a-secret
          EOF
      - name: Validate consolidated Docker Compose
        working-directory: .
        run: docker compose -f docker-compose.yaml config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django_bridge/requirements.txt
      - name: Install Django bridge dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django and pipeline tests
        run: python manage.py test --verbosity 2

  postgres-checks:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: ramon
          POSTGRES_USER: ramon
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramon -d ramon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/django_bridge
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: ramon
      DJANGO_DB_USER: ramon
      DJANGO_DB_PASSWORD: ci-only-not-a-secret
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      RAMON_EA_BEARER_TOKEN: ci-test-token
      RAMON_PIPELINE_INGEST_ENABLED: "0"
      RAMON_REDIS_URL: redis://127.0.0.1:6379/0
      RAMON_PG_PASSWORD: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only-not-a-secret
      RAMON_LOG_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django_bridge/requirements.txt
      - name: Install Django bridge dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks (PostgreSQL)
        run: python manage.py check
      - name: Verify migrations match models (PostgreSQL)
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django and pipeline tests (PostgreSQL)
        run: python manage.py test --verbosity 2
