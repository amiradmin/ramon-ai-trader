name: Ramon Django pipeline checks

on:
  pull_request:
    paths:
      - "backend/django_bridge/**"
      - "compose.django.yaml"
      - "docs/ramon-django-pipeline/**"
      - ".github/workflows/ramon-django-pipeline.yml"
  push:
    branches: ["feat/ramon-django-pipeline"]
    paths:
      - "backend/django_bridge/**"
      - "compose.django.yaml"
      - ".github/workflows/ramon-django-pipeline.yml"

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django_bridge
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DB_PATH: /tmp/ramon-django-ci.sqlite3
      RAMON_EA_BEARER_TOKEN: ci-test-token
      RAMON_PIPELINE_INGEST_ENABLED: "0"
      RAMON_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django_bridge/requirements.txt
      - name: Install Django bridge dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django and pipeline tests
        run: python manage.py test --verbosity 2
