services:
  model:
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      CHRONOS_MODEL: ${CHRONOS_MODEL:-autogluon/chronos-2-small}
      CHRONOS_MODEL_FILE: /checkpoints/active_model.txt
      CHRONOS_DEVICE: cpu
      RAMON_HISTORY_DB: /data/ramon_history.sqlite3
      RAMON_ENSEMBLE_DIR: /checkpoints/ensemble
      RAMON_ROLE_MODE: shadow
      RAMON_RANGE_LIVE_ENABLED: "1"
      RAMON_TIMESFM3_SHADOW_ENABLED: ${RAMON_TIMESFM3_SHADOW_ENABLED:-0}
      RAMON_TIMESFM3_CHECKPOINT: ${RAMON_TIMESFM3_CHECKPOINT:-google/timesfm-3.0-pytorch}
      RAMON_TIMESFM3_DEVICE: ${RAMON_TIMESFM3_DEVICE:-cpu}
      RAMON_MOMENT_SHADOW_ENABLED: ${RAMON_MOMENT_SHADOW_ENABLED:-1}
      RAMON_MOMENT_CHECKPOINT: ${RAMON_MOMENT_CHECKPOINT:-AutonLab/MOMENT-1-small}
      RAMON_MOMENT_LIVE_ENABLED: ${RAMON_MOMENT_LIVE_ENABLED:-1}
      RAMON_MOMENT_LIVE_THRESHOLD: ${RAMON_MOMENT_LIVE_THRESHOLD:-2.0}
      RAMON_FINBERT_SHADOW_ENABLED: ${RAMON_FINBERT_SHADOW_ENABLED:-1}
      RAMON_FINBERT_CHECKPOINT: ${RAMON_FINBERT_CHECKPOINT:-ProsusAI/finbert}
      RAMON_FINBERT_LIVE_ENABLED: ${RAMON_FINBERT_LIVE_ENABLED:-1}
      RAMON_FINBERT_LIVE_THRESHOLD: ${RAMON_FINBERT_LIVE_THRESHOLD:-0.35}
      RAMON_NEWS_ENABLED: ${RAMON_NEWS_ENABLED:-1}
      RAMON_NEWS_URL: ${RAMON_NEWS_URL:-https://nfs.faireconomy.media/ff_calendar_thisweek.json}
      RAMON_NEWS_REFRESH_SECONDS: ${RAMON_NEWS_REFRESH_SECONDS:-300}
      RAMON_NEWS_TIMEOUT_SECONDS: ${RAMON_NEWS_TIMEOUT_SECONDS:-2.0}
      RAMON_NEWS_MAX_STALE_SECONDS: ${RAMON_NEWS_MAX_STALE_SECONDS:-1800}
      HF_HOME: /home/ramon/.cache/huggingface
    volumes:
      - chronos_cache:/home/ramon/.cache/huggingface
      - ./data:/data
      - ./checkpoints:/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  dashboard:
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command:
      - python
      - -m
      - ramon.monitor
      - --host
      - 0.0.0.0
      - --port
      - "8013"
      - --db
      - /data/ramon_history.sqlite3
      - --health-url
      - http://model:8012/health
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    ports:
      - "127.0.0.1:8013:8013"
    volumes:
      - ./data:/data:ro
      - ${HOME}/.mt5/drive_c/users:/mt5-users

  market-dashboard:
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command:
      - python
      - -m
      - ramon.market_dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8014"
      - --db
      - /data/ramon_history.sqlite3
      - --health-url
      - http://model:8012/health
      - --model-url
      - http://model:8012
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    ports:
      - "8014:8014"
    volumes:
      - ./data:/data:ro
      - ${HOME}/.mt5/drive_c/users:/mt5-users:ro

  trade-outbox:
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command: ["python", "-m", "ramon.trade_outbox", "--model-url", "http://model:8012/trades"]
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    volumes:
      - ${HOME}/.mt5/drive_c/users:/mt5-users

  tools:
    profiles: ["tools"]
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    environment:
      HF_HOME: /home/ramon/.cache/huggingface
    volumes:
      - chronos_cache:/home/ramon/.cache/huggingface
      - ./data:/data
      - ./checkpoints:/checkpoints
    entrypoint: ["python"]
    command: ["-m", "ramon.preflight", "--device", "cpu"]

  mt5:
    profiles: ["mt5"]
    build:
      context: .
      dockerfile: Dockerfile.mt5
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader-mt5:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      RAMON_WINEPREFIX: /home/ramon/.wine
    volumes:
      - mt5_prefix:/home/ramon/.wine
      - ./installer:/installer:ro

volumes:
  chronos_cache:
  mt5_prefix:
