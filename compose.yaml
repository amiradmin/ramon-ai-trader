services:
  model:
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      CHRONOS_MODEL: ${CHRONOS_MODEL:-autogluon/chronos-2-small}
      CHRONOS_MODEL_FILE: /checkpoints/active_model.txt
      CHRONOS_DEVICE: cpu
      RAMON_HISTORY_DB: /data/ramon_history.sqlite3
      RAMON_ENSEMBLE_DIR: /checkpoints/ensemble
      RAMON_ROLE_MODE: ${RAMON_ROLE_MODE:-direction_live}
      RAMON_RANGE_LIVE_ENABLED: "1"
      RAMON_REVERSAL_LIVE_ENABLED: ${RAMON_REVERSAL_LIVE_ENABLED:-0}
      RAMON_TIMESFM3_EXPERIMENTAL_ENABLED: ${RAMON_TIMESFM3_EXPERIMENTAL_ENABLED:-0}
      RAMON_TIMESFM3_CHECKPOINT: ${RAMON_TIMESFM3_CHECKPOINT:-google/timesfm-3.0-pytorch}
      RAMON_TIMESFM3_DEVICE: ${RAMON_TIMESFM3_DEVICE:-cpu}
      RAMON_MOMENT_ENABLED: ${RAMON_MOMENT_ENABLED:-1}
      RAMON_MOMENT_CHECKPOINT: ${RAMON_MOMENT_CHECKPOINT:-AutonLab/MOMENT-1-small}
      RAMON_MOMENT_LIVE_ENABLED: ${RAMON_MOMENT_LIVE_ENABLED:-1}
      RAMON_MOMENT_LIVE_THRESHOLD: ${RAMON_MOMENT_LIVE_THRESHOLD:-2.0}
      RAMON_MOMENT_HARD_VETO_THRESHOLD: ${RAMON_MOMENT_HARD_VETO_THRESHOLD:-5.0}
      RAMON_FINBERT_ENABLED: ${RAMON_FINBERT_ENABLED:-1}
      RAMON_FINBERT_CHECKPOINT: ${RAMON_FINBERT_CHECKPOINT:-ProsusAI/finbert}
      RAMON_FINBERT_LIVE_ENABLED: ${RAMON_FINBERT_LIVE_ENABLED:-1}
      RAMON_FINBERT_LIVE_THRESHOLD: ${RAMON_FINBERT_LIVE_THRESHOLD:-0.35}
      RAMON_SELECTOR_LIVE_ENABLED: ${RAMON_SELECTOR_LIVE_ENABLED:-1}
      RAMON_AI_ENGINE_V2_ENABLED: ${RAMON_AI_ENGINE_V2_ENABLED:-1}
      RAMON_AI_ENGINE_V2_CONSERVATIVE_POLICY: ${RAMON_AI_ENGINE_V2_CONSERVATIVE_POLICY:-0}
      RAMON_AI_ENGINE_V2_MIN_SCORE: ${RAMON_AI_ENGINE_V2_MIN_SCORE:-0.56}
      RAMON_AI_ENGINE_V2_MIN_MARGIN: ${RAMON_AI_ENGINE_V2_MIN_MARGIN:-0.03}
      RAMON_AI_ENGINE_V3_SHADOW_ENABLED: ${RAMON_AI_ENGINE_V3_SHADOW_ENABLED:-1}
      RAMON_AI_ENGINE_V3_MAX_FORECAST_DISTANCE_ATR: ${RAMON_AI_ENGINE_V3_MAX_FORECAST_DISTANCE_ATR:-0.80}
      RAMON_SELECTOR_MIN_QUALITY: ${RAMON_SELECTOR_MIN_QUALITY:-0.55}
      RAMON_SELECTOR_MAX_FULL_SL: ${RAMON_SELECTOR_MAX_FULL_SL:-0.50}
      RAMON_SELECTOR_MIN_MARGIN: ${RAMON_SELECTOR_MIN_MARGIN:-0.05}
      RAMON_NEWS_ENABLED: ${RAMON_NEWS_ENABLED:-1}
      RAMON_NEWS_URL: ${RAMON_NEWS_URL:-https://nfs.faireconomy.media/ff_calendar_thisweek.json}
      RAMON_NEWS_REFRESH_SECONDS: ${RAMON_NEWS_REFRESH_SECONDS:-300}
      RAMON_NEWS_TIMEOUT_SECONDS: ${RAMON_NEWS_TIMEOUT_SECONDS:-2.0}
      RAMON_NEWS_MAX_STALE_SECONDS: ${RAMON_NEWS_MAX_STALE_SECONDS:-1800}
      HF_HOME: /home/ramon/.cache/huggingface
    volumes:
      - chronos_cache:/home/ramon/.cache/huggingface
      - ./data:/data
      - ./checkpoints:/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3); assert json.load(r).get('ready') is True"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  dashboard:
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command:
      - python
      - -m
      - ramon.monitor
      - --host
      - 0.0.0.0
      - --port
      - "8013"
      - --db
      - /data/ramon_history.sqlite3
      - --health-url
      - http://model:8012/health
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    ports:
      - "127.0.0.1:8013:8013"
    volumes:
      - ./data:/data:ro
      - ${HOME}/.mt5/drive_c/users:/mt5-users

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/monitor', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  kronos-advisor:
    profiles: ["advisors"]
    build:
      context: .
      dockerfile: Dockerfile.advisors
    image: ramon-ai-trader-advisors:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 2g
    environment:
      HF_HOME: /home/ramon/.cache/huggingface
    volumes:
      - chronos_cache:/home/ramon/.cache/huggingface
      - ./data:/data

  training-dashboard:
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command:
      - python
      - -m
      - ramon.training_dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8015"
      - --db
      - /data/ramon_history.sqlite3
      - --out
      - /checkpoints/ensemble
      - --model-url
      - http://model:8012
      - --minimum-samples
      - "500"
    environment:
      CHRONOS_MODEL: ${CHRONOS_MODEL:-autogluon/chronos-2-small}
    ports:
      - "127.0.0.1:8015:8015"
    volumes:
      - ./data:/data
      - ./checkpoints:/checkpoints

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  market-dashboard:
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command:
      - python
      - -m
      - ramon.market_dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8014"
      - --db
      - /data/ramon_history.sqlite3
      - --health-url
      - http://model:8012/health
      - --model-url
      - http://model:8012
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    ports:
      - "8014:8014"
    volumes:
      - ./data:/data:ro
      - ${HOME}/.mt5/drive_c/users:/mt5-users:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  trade-outbox:
    image: ramon-ai-trader:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    command: ["python", "-m", "ramon.trade_outbox", "--model-url", "http://model:8012/trades"]
    environment:
      RAMON_MT5_USERS_ROOT: /mt5-users
    volumes:
      - ${HOME}/.mt5/drive_c/users:/mt5-users

  tools:
    profiles: ["tools"]
    build:
      context: .
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader:local
    init: true
    environment:
      HF_HOME: /home/ramon/.cache/huggingface
    volumes:
      - chronos_cache:/home/ramon/.cache/huggingface
      - ./data:/data
      - ./checkpoints:/checkpoints
    entrypoint: ["python"]
    command: ["-m", "ramon.preflight", "--device", "cpu"]

  mt5:
    profiles: ["mt5"]
    build:
      context: .
      dockerfile: Dockerfile.mt5
      args:
        RAMON_UID: ${RAMON_UID:-1000}
        RAMON_GID: ${RAMON_GID:-1000}
    image: ramon-ai-trader-mt5:local
    init: true
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      RAMON_WINEPREFIX: /home/ramon/.wine
    volumes:
      - mt5_prefix:/home/ramon/.wine
      - ./installer:/installer:ro

volumes:
  chronos_cache:
  mt5_prefix:
