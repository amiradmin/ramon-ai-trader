# Isolated integration-test database. Never include this file in live Compose.
name: ramon-postgres-integration-test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ramon_test
      POSTGRES_USER: ramon_test
      POSTGRES_PASSWORD: ramon_test_only
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramon_test -d ramon_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [test-only]
networks:
  test-only:
    internal: true
