[project]
name = "ramon"
version = "0.1.0"
description = "Independent Chronos-2 gold M15 decision service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
research = ["xgboost-cpu>=3,<4", "numpy>=1.26,<3", "pyarrow>=18,<25"]
model = ["chronos-forecasting>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
train = ["peft>=0.13,<1"]
timesfm = ["timesfm[torch]>=3.0,<4"]
shadow_models = [
  "momentfm @ https://github.com/moment-timeseries-foundation-model/moment/archive/refs/heads/main.zip",
  "transformers>=4.54.1,<6",
  "safetensors>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.hatch.metadata]
allow-direct-references = true
