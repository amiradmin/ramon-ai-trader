[project]
name = "ramon"
version = "0.1.0"
description = "Independent Chronos-2 gold M15 decision service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
model = ["chronos-forecasting>=2.1,<3", "numpy>=1.26,<3"]
train = ["peft>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
