name: ramon

# Start the complete stack (all services are enabled by default):
# docker compose up -d --build --wait --wait-timeout 180
# Each worker remains independently startable: docker compose up -d <service>
# Console logs are operational; durable training evidence lives in PostgreSQL.
x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-python-service: &python-service
  logging: *container-logging
  build:
    context: .
    dockerfile: backend/django_bridge/Dockerfile
  restart: unless-stopped
  init: true
  env_file: [.env]

services:
  django:
    <<: *python-service
    container_name: ramon-django
    environment:
      DJANGO_SETTINGS_MODULE: ramon_django.settings
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,django"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: timescaledb
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-ramon}
      DJANGO_DB_USER: ${POSTGRES_USER:-ramon}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RAMON_REDIS_URL: redis://redis:6379/0
      RAMON_DJANGO_DECISION_ENABLED: "1"
      RAMON_STRATEGY_CONTAINERS_ENABLED: "1"
      RAMON_SCALP_SHADOW_ENABLED: "1"
      RAMON_SCALP_EXECUTION_ENABLED: "${RAMON_SCALP_EXECUTION_ENABLED:-0}"
      # Fail closed by default. Opt in locally only after verifying a demo account.
      RAMON_PROFIT_PROTECTION_INSTANCE: "${RAMON_PROFIT_PROTECTION_INSTANCE:-}"
      RAMON_PROFIT_PROTECTION_LOGIN: "${RAMON_PROFIT_PROTECTION_LOGIN:-}"
      RAMON_PROFIT_PROTECTION_SERVER: "${RAMON_PROFIT_PROTECTION_SERVER:-}"
      RAMON_DEMO_PROFIT_PROTECTION_ENABLED: "${RAMON_DEMO_PROFIT_PROTECTION_ENABLED:-0}"
      RAMON_EA_COMMAND_CREATION_ENABLED: "${RAMON_EA_COMMAND_CREATION_ENABLED:-0}"
      RAMON_EA_COMMAND_EXECUTION_ENABLED: "${RAMON_EA_COMMAND_EXECUTION_ENABLED:-0}"
      RAMON_PIPELINE_INGEST_ENABLED: "0"
      RAMON_EA_MAX_BODY_BYTES: "524288"
    volumes:
      - learning_models:/app/media
    ports:
      - "127.0.0.1:8017:8016"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ramon_backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  ingest-worker:
    <<: *python-service
    container_name: ramon-ingest-worker
    environment:
      DJANGO_SETTINGS_MODULE: ramon_django.settings
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,django"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: timescaledb
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-ramon}
      DJANGO_DB_USER: ${POSTGRES_USER:-ramon}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RAMON_REDIS_URL: redis://redis:6379/0
      RAMON_REDIS_CONSUMER: ramon-ingest-worker-1
      RAMON_PIPELINE_INGEST_ENABLED: "0"
    command:
      - python
      - manage.py
      - consume_ramon_streams
      - --count
      - "100"
      - --block-ms
      - "1000"
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - ramon_backend

  trend-pullback:
    <<: *python-service
    container_name: ramon-trend-pullback
    environment:
      DJANGO_SETTINGS_MODULE: ramon_django.settings
      DJANGO_DEBUG: "0"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: timescaledb
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-ramon}
      DJANGO_DB_USER: ${POSTGRES_USER:-ramon}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RAMON_STRATEGY_CONTAINERS_ENABLED: "1"
      RAMON_STRATEGY_SETUP: TREND_PULLBACK
      RAMON_SCALP_EXECUTION_ENABLED: "0"
      RAMON_EA_COMMAND_CREATION_ENABLED: "${RAMON_EA_COMMAND_CREATION_ENABLED:-0}"
      RAMON_EA_COMMAND_EXECUTION_ENABLED: "${RAMON_EA_COMMAND_EXECUTION_ENABLED:-0}"
      RAMON_DEMO_PROFIT_PROTECTION_ENABLED: "${RAMON_DEMO_PROFIT_PROTECTION_ENABLED:-0}"
    command: ["python", "manage.py", "run_strategy_worker"]
    depends_on:
      django:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/strategy-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [ramon_backend]

