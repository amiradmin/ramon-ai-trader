name: ramon

services:
  django:
    build:
      context: .
      dockerfile: backend/django_bridge/Dockerfile
    container_name: ramon-django
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ramon_django.settings
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,django"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: timescaledb
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-ramon}
      DJANGO_DB_USER: ${POSTGRES_USER:-ramon}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RAMON_REDIS_URL: redis://redis:6379/0
      RAMON_DJANGO_DECISION_ENABLED: "1"
      RAMON_EA_COMMAND_EXECUTION_ENABLED: ${RAMON_EA_COMMAND_EXECUTION_ENABLED:-0}
      RAMON_PIPELINE_INGEST_ENABLED: "0"
    ports:
      - "127.0.0.1:8017:8016"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ramon_backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: backend/django_bridge/Dockerfile
    container_name: ramon-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ramon_django.settings
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,django"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_HOST: timescaledb
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-ramon}
      DJANGO_DB_USER: ${POSTGRES_USER:-ramon}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RAMON_REDIS_URL: redis://redis:6379/0
      RAMON_REDIS_CONSUMER: ramon-worker-1
      RAMON_PIPELINE_INGEST_ENABLED: "0"
    command:
      - python
      - manage.py
      - consume_ramon_streams
      - --count
      - "100"
      - --block-ms
      - "1000"
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - ramon_backend

  redis:
    image: redis:7-alpine
    container_name: ramon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - ramon_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: ramon-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ramon}
      POSTGRES_USER: ${POSTGRES_USER:-ramon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ramon_backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  ramon_backend:
    driver: bridge

volumes:
  timescale_data:
  redis_data:
