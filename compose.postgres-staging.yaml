# Explicit opt-in PG staging override. Do not use against live trading containers.
# Launch only training-dashboard / report with their service names after code review.
services:
  training-dashboard:
    image: ramon-ai-trader:pg-canary-working
    volumes:
      - ./src:/app/src:ro
      - ./scripts/pg_service_entrypoint.sh:/app/pg_service_entrypoint.sh:ro
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro
    entrypoint: ["/bin/sh", "/app/pg_service_entrypoint.sh"]
    environment:
      PYTHONPATH: /app/src
      RAMON_STORAGE_BACKEND: postgres
      RAMON_TRAINING_BACKEND: postgres
  dashboard:
    image: ramon-ai-trader:pg-canary-working
    volumes:
      - ./src:/app/src:ro
      - ./scripts/pg_service_entrypoint.sh:/app/pg_service_entrypoint.sh:ro
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro
    entrypoint: ["/bin/sh", "/app/pg_service_entrypoint.sh"]
    environment:
      PYTHONPATH: /app/src
      RAMON_STORAGE_BACKEND: postgres
